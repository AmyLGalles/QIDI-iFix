# QIDI i-Fast — Klipper config for BTT Octopus Pro V1.1 (STM32H723)
# All TMC2209 drivers in UART mode
#
# Motor assignments (physical socket → function):
#   MOTOR2 → E2 (left extruder)
#   MOTOR3 → E1 (right extruder)
#   MOTOR4 → Z2
#   MOTOR5 → Z1
#   MOTOR6 → X (config pins swapped with MOTOR7)
#   MOTOR7 → Y (config pins swapped with MOTOR6)
#
# Fan assignments:
#   FAN0/PA8  → E1 part cooling (24V)
#   FAN1/PE5  → E1 hotend fan (12V)
#   FAN2/PD12 → E2 part cooling (24V)
#   FAN3/PD13 → E2 hotend fan (12V)
#   FAN4/PD14 → Chamber circulation (24V)
#   FAN5/PD15 → Board cooling (24V)
#   HE3/PB11  → Chamber exhaust (24V)

[include mainsail.cfg]
[include eddy.cfg]
# [include power_loss_recovery.cfg]
# [include power_loss_recovery_macros.cfg]

# =============================================
# MCU
# =============================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_22001F000951333231343036-if00

# [mcu eddy]
# serial: /dev/serial/by-id/usb-Klipper_rp2040_50445059303F971C-if00
# restart_method: command

# =============================================
# LEDs
# =============================================
[output_pin chamber_lights]
pin: PB7
value: 1

[gcode_macro LIGHTS]
gcode:
    {% if printer["output_pin chamber_lights"].value == 1 %}
        SET_PIN PIN=chamber_lights VALUE=0
    {% else %}
        SET_PIN PIN=chamber_lights VALUE=1
    {% endif %}

# =============================================
# PRINTER
# =============================================
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
max_z_velocity: 8
max_z_accel: 100

[force_move]
enable_force_move: True

# =============================================
# X AXIS — MOTOR6 pins (physically swapped with Y)
# Endstop at front-left (min position)
# Homing to left also activates T1 (left nozzle)
# =============================================
[stepper_x]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG14
position_endstop: 0
position_min: -5
position_max: 385
homing_speed: 30
second_homing_speed: 5

# =============================================
# Y AXIS — MOTOR7 pins (physically swapped with X)
# Endstop at front-left (min position)
# =============================================
[stepper_y]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG15
position_endstop: 0
position_min: 0
position_max: 255
homing_speed: 30
second_homing_speed: 5

# =============================================
# Z AXIS — MOTOR5 (Z1, left) and MOTOR4 (Z2, right)
# Endstop at bottom (max position, bed fully down)
# Positive Z = bed moves down (away from nozzle)
# =============================================
[stepper_z]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG13
position_endstop: 325
position_min: -5
position_max: 330
homing_speed: 8
second_homing_speed: 4
homing_positive_dir: true

[stepper_z1]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG12

# =============================================
# HOMING OVERRIDE — supports individual axis homing
# Homing X activates T1 physically (left nozzle)
# =============================================
[homing_override]
gcode:
    SET_GCODE_OFFSET Z=0
    G90
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < 10 %}
            G1 Z10 F300
        {% endif %}
    {% endif %}
    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}
    {% if home_all or 'X' in params %}
        G28 X
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_GCODE_OFFSET Z={printer["gcode_macro _OFFSETS"].t1_z}
    {% endif %}
    {% if home_all or 'Z' in params %}
        G28 Z
    {% endif %}
axes: xyz

# =============================================
# EXTRUDER 1 (right, E1) — MOTOR3
# PT1000 via analog input T0
# E1 heater must be wired directly to HE0 (bypass breakout boards)
# =============================================
[extruder]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 22.31
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: PA0
sensor_type: PT1000
sensor_pin: PF4
min_temp: 0
max_temp: 320
min_extrude_temp: 180
smooth_time: 2.0

# =============================================
# EXTRUDER 2 (left, E2) — MOTOR2
# PT1000 via analog input T1
# =============================================
[extruder1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 21.57
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: PA3
sensor_type: PT1000
sensor_pin: PF5
min_temp: 0
max_temp: 320
min_extrude_temp: 180
smooth_time: 2.0

# =============================================
# HEATED BED — via relay board
# Octopus HB output → relay control in
# 24V PSU → relay DC in → bed heater
# =============================================
[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120

[verify_heater extruder]
max_error: 200
check_gain_time: 40

[verify_heater extruder1]
max_error: 200
check_gain_time: 40

# =============================================
# CHAMBER HEATER — 12 ohm, 48W at 24V
# =============================================
[heater_generic chamber]
heater_pin: PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF6
min_temp: 0
max_temp: 80

# =============================================
# TMC2209 DRIVER CONFIGURATION
# =============================================

# X — MOTOR6 pins
[tmc2209 stepper_x]
uart_pin: PE1
run_current: 0.650
stealthchop_threshold: 999999

# Y — MOTOR7 pins
[tmc2209 stepper_y]
uart_pin: PD3
run_current: 0.650
stealthchop_threshold: 999999

# Z1 — MOTOR5
[tmc2209 stepper_z]
uart_pin: PE4
run_current: 0.325
stealthchop_threshold: 999999

# Z2 — MOTOR4
[tmc2209 stepper_z1]
uart_pin: PF2
run_current: 0.325
stealthchop_threshold: 999999

# E1 — MOTOR3
[tmc2209 extruder]
uart_pin: PC7
run_current: 0.650
stealthchop_threshold: 999999

# E2 — MOTOR2
[tmc2209 extruder1]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999

# =============================================
# FANS
# =============================================

# E1 part cooling fan (24V, slicer controlled)
[fan]
pin: PA8

# E1 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan]
pin: PE5
heater: extruder
heater_temp: 50.0

# E2 part cooling fan (24V)
[fan_generic extruder1_fan]
pin: PD12

# E2 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan2]
pin: PD13
heater: extruder1
heater_temp: 50.0

# Chamber circulation fan (24V)
[fan_generic chamber_fan]
pin: PD14

# Board cooling fan (24V)
[controller_fan board_fan]
pin: PD15
fan_speed: 1.0
idle_timeout: 60

# Chamber exhaust fan (24V)
[fan_generic exhaust_fan]
pin: PB11

# =============================================
# BTT EDDY DUO PROBE
# =============================================
[gcode_macro PROBE_OR_LOAD]
gcode:
    {% if "probe_eddy_current btt_eddy" in printer %}
        SET_GCODE_OFFSET Z=0
        G1 Z2 F300
        Z_TILT_ADJUST
        BED_MESH_CALIBRATE
    {% else %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}

# [probe_eddy_current btt_eddy]
# sensor_type: ldc1612
# i2c_mcu: eddy
# i2c_bus: i2c0f
# x_offset: 26.86
# y_offset: -12.82
# descend_z: 1.0

# [temperature_sensor btt_eddy_mcu]
# sensor_type: temperature_mcu
# sensor_mcu: eddy
# min_temp: 10
# max_temp: 100

# [temperature_sensor btt_eddy]
# sensor_type: Generic 3950
# sensor_pin: eddy:gpio26

# =============================================
# BED MESH
# =============================================
[bed_mesh]
speed: 120
horizontal_move_z: 2
mesh_min: 70, 60
mesh_max: 345, 230
probe_count: 5, 5

# =============================================
# Z TILT — stepper_z is LEFT, stepper_z1 is RIGHT
# =============================================
[z_tilt]
z_positions:
    0, 127
    375, 127
points:
    60, 127
    310, 127
speed: 50
horizontal_move_z: 2
retries: 10
retry_tolerance: 0.05

# =============================================
# TOOL CHANGE MACROS
# T0 = right nozzle (E1), T1 = left nozzle (E2)
# =============================================
[gcode_macro _OFFSETS]
variable_t0_z: -2.400
variable_t1_z: -2.650
variable_t1_x: 28
gcode:

[gcode_macro T0]
gcode:
    G90
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 X380 F6000
        G1 X370 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET Z={printer["gcode_macro _OFFSETS"].t0_z} X=0 MOVE=1

[gcode_macro T1]
gcode:
    G90
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 X-3 F6000
        G1 X35 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_GCODE_OFFSET Z={printer["gcode_macro _OFFSETS"].t1_z} X={printer["gcode_macro _OFFSETS"].t1_x} MOVE=1

# =============================================
# CENTER CARRIAGE MACRO
# =============================================
[gcode_macro CENTER]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X190 Y127 F6000

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 187
variable_custom_park_y: 127
variable_custom_park_dz: 10
variable_speed_hop: 15
variable_speed_move: 100
variable_retract: 2
variable_unretract: 2
gcode:


# =============================================
# PAUSE AND RESUME MACROS
# =============================================

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE2
description: Pause with extruder state saving
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    {% set z_offset = printer.gcode_move.homing_origin.z %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_extruder VALUE="'{active_extruder}'"
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z_offset VALUE={z_offset}
    PAUSE_BASE2

[gcode_macro RESUME]
rename_existing: RESUME_BASE2
description: Resume with extruder state restore
variable_saved_extruder: 'extruder'
variable_saved_z_offset: 0
gcode:
    {% set extruder = saved_extruder %}
    {% set z_offset = saved_z_offset %}
    ACTIVATE_EXTRUDER EXTRUDER={extruder}
    SET_GCODE_OFFSET Z={z_offset}
    RESUME_BASE2

# =============================================
# CANCEL PRINT MACRO
# =============================================
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M106 S0
    SET_GCODE_OFFSET Z=0
    G90
    {% if printer.extruder.temperature > 170 %}
        G92 E0
        G1 E-5 F1800
    {% endif %}
    G91
    G1 Z10 F300
    G90
    G1 X187 Y127 F6000
    M84
    BASE_CANCEL_PRINT

