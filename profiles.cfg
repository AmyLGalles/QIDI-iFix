# =============================================
# QIDI i-Fast — Profiles & Tool Change Configuration
# =============================================
# This file manages:
#   - Nozzle offsets (per carriage)
#   - Bed plate Z compensation
#   - Tool change macros (T0/T1)
#   - Carriage and bed profile switching
#
# Usage:
#   SET_CARRIAGE NAME=standard
#   SET_BED NAME=tape
#   SET_SETUP CARRIAGE=standard BED_TYPE=tape
#
# Measure offsets for new carriages/beds:
#   1. Zero all offsets: SET_GCODE_OFFSET X=0 Y=0 Z=0
#   2. Home: G28
#   3. Jog to paper friction for each nozzle
#   4. Record values as t0_z, t1_z, etc.
#   5. For beds: measure difference from standard bed
# =============================================

# =============================================
# OFFSET VARIABLES
# These are the active offsets used by T0/T1 macros
# Changed by SET_CARRIAGE and SET_BED macros
# =============================================
[gcode_macro _OFFSETS]
variable_t0_z: 0.023
variable_t1_z: -0.279
variable_t0_x: 11.21
variable_t1_x: 46.25
variable_t0_y: -0.5
variable_bed_z: 0.0
gcode:

# =============================================
# TOOL CHANGE MACROS
# T0 = right nozzle (extruder)
# T1 = left nozzle (extruder1)
# Z offset = carriage offset + bed offset
# =============================================
[gcode_macro T0]
gcode:
    G90
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% if "xyz" in printer.toolhead.homed_axes %}
        # Move bed down if too close to nozzle
        {% if printer.toolhead.position.z < 1 %}
            G1 Z5 F300
        {% endif %}
        G1 X380 F6000
        G1 X350 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% set total_z = printer["gcode_macro _OFFSETS"].t0_z + printer["gcode_macro _OFFSETS"].bed_z %}
    SET_GCODE_OFFSET Z={total_z} X={printer["gcode_macro _OFFSETS"].t0_x} Y={printer["gcode_macro _OFFSETS"].t0_y} MOVE=1

[gcode_macro T1]
gcode:
    G90
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% if "xyz" in printer.toolhead.homed_axes %}
        # Move bed down if too close to nozzle
        {% if printer.toolhead.position.z < 1 %}
            G1 Z5 F300
        {% endif %}
        G1 X-3 F6000
        G1 X35 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    {% set total_z = printer["gcode_macro _OFFSETS"].t1_z + printer["gcode_macro _OFFSETS"].bed_z %}
    SET_GCODE_OFFSET Z={total_z} X={printer["gcode_macro _OFFSETS"].t1_x} Y=0 MOVE=1

# =============================================
# CARRIAGE PROFILES
# Each carriage has its own nozzle offsets
# Measure with paper friction test at zero offsets
# =============================================
[gcode_macro SET_CARRIAGE]
gcode:
    {% set name = params.NAME|default("standard") %}
    
    {% if name == "standard" %}
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t0_z VALUE=0.023
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t1_z VALUE=-0.279
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t0_x VALUE=11.21
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t1_x VALUE=46.25
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t0_y VALUE=-0.5
        M117 Standard carriage loaded
    
    {% elif name == "hightemp" %}
        # TODO: measure these values with paper friction test
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t0_z VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t1_z VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t0_x VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t1_x VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=t0_y VALUE=0.0
        M117 High temp carriage loaded
    
    {% else %}
        M117 Unknown carriage: {name}
    {% endif %}

# =============================================
# BED PLATE PROFILES
# Each bed has a Z delta and a saved mesh
# Measure bed_z as difference from standard bed
#   Negative = thicker plate (nozzle closer)
#   Positive = thinner plate (nozzle farther)
# Save meshes with: MANUAL_PROBE_BED NAME=<bed>_bed
# =============================================
[gcode_macro SET_BED]
gcode:
    {% set name = params.NAME|default("tape") %}
    
    {% if name == "tape" %}
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=bed_z VALUE=0.0
        BED_MESH_PROFILE LOAD=tape_bed
        M117 Tape bed loaded
    
    {% elif name == "sequin" %}
        # TODO: measure this value
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=bed_z VALUE=0.0
        BED_MESH_PROFILE LOAD=sequin_bed
        M117 Sequin bed loaded
    
    {% elif name == "pei" %}
        # TODO: measure this value
        SET_GCODE_VARIABLE MACRO=_OFFSETS VARIABLE=bed_z VALUE=0.0
        BED_MESH_PROFILE LOAD=pei_bed
        M117 PEI bed loaded
    
    {% else %}
        M117 Unknown bed: {name}
    {% endif %}

# =============================================
# CONVENIENCE MACRO — set both at once
# Usage: SET_SETUP CARRIAGE=standard BED_TYPE=tape
# =============================================
[gcode_macro SET_SETUP]
gcode:
    {% set carriage = params.CARRIAGE|default("standard") %}
    {% set bed = params.BED_TYPE|default("tape") %}
    SET_CARRIAGE NAME={carriage}
    SET_BED NAME={bed}
    M117 Setup: {carriage} + {bed}
