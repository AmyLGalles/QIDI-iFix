# QIDI i-Fast — Klipper config for BTT Octopus Pro V1.1 (STM32H723)
# All TMC2209 drivers in UART mode
#
# Motor assignments:
#   MOTOR2 → E2 (left extruder)
#   MOTOR3 → E1 (right extruder)
#   MOTOR4 → Z2
#   MOTOR5 → Z1
#   MOTOR6 → Y
#   MOTOR7 → X
#
# Fan assignments:
#   FAN0/PA8  → E1 part cooling (24V)
#   FAN1/PE5  → E1 hotend fan (12V)
#   FAN2/PD12 → E2 part cooling (24V)
#   FAN3/PD13 → E2 hotend fan (12V)
#   FAN4/PD14 → Chamber circulation (24V)
#   FAN5/PD15 → Board cooling (24V)
#   HE3/PB11  → Chamber exhaust (24V)

[include mainsail.cfg]

# =============================================
# MCU
# =============================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_22001F000951333231343036-if00

# =============================================
# PRINTER
# =============================================
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
max_z_velocity: 8
max_z_accel: 100

[force_move]
enable_force_move: True

# =============================================
# X AXIS — MOTOR7
# Endstop at front-left (min position)
# =============================================
[stepper_x]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG14
position_endstop: 0
position_min: 0
position_max: 375
homing_speed: 30
second_homing_speed: 5

# =============================================
# Y AXIS — MOTOR6
# Endstop at front-left (min position)
# =============================================
[stepper_y]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG15
position_endstop: 0
position_min: 0
position_max: 255
homing_speed: 30
second_homing_speed: 5

# =============================================
# Z AXIS — MOTOR5 (Z1) and MOTOR4 (Z2)
# Endstop at bottom (max position, bed fully down)
# Positive Z = bed moves down (away from nozzle)
# NOTE: dir_pin inversion may need retesting with new sockets
# =============================================
[stepper_z]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG13
position_endstop: 320
position_min: 0
position_max: 320
homing_speed: 8
second_homing_speed: 4
homing_positive_dir: true

[stepper_z1]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG12

# =============================================
# HOMING OVERRIDE — Y must home first
# =============================================
[homing_override]
gcode:
    G28 Y
    G28 X
    G1 X187 Y127 F3000
    G28 Z
axes: xyz

# =============================================
# EXTRUDER 1 (right, E1) — MOTOR3
# PT1000 via onboard MAX31865
# =============================================
[extruder]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 34.24
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0
sensor_type: MAX31865
sensor_pin: PF8
spi_bus: spi1
rtd_reference_r: 430
rtd_num_of_wires: 2
control: pid
pid_Kp: 18
pid_Ki: 1.08
pid_Kd: 98
min_temp: 0
max_temp: 250
min_extrude_temp: 180

# =============================================
# EXTRUDER 2 (left, E2) — MOTOR2
# PT1000 via analog input T1
# Nozzle offset: -34mm in X, 0 in Y relative to E1
# =============================================
[extruder1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 34.24
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA3
sensor_type: PT1000
sensor_pin: PF5
control: pid
pid_Kp: 18
pid_Ki: 1.08
pid_Kd: 98
min_temp: 0
max_temp: 250
min_extrude_temp: 180

# =============================================
# HEATED BED — via relay board
# =============================================
[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 50
pid_Ki: 3.0
pid_Kd: 200
min_temp: 0
max_temp: 120

# =============================================
# CHAMBER HEATER — 12 ohm, 48W at 24V
# =============================================
[heater_generic chamber]
heater_pin: PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF6
control: pid
pid_Kp: 50
pid_Ki: 3.0
pid_Kd: 200
min_temp: 0
max_temp: 80

# =============================================
# TMC2209 DRIVER CONFIGURATION
# =============================================

# X — MOTOR7
[tmc2209 stepper_x]
uart_pin: PD3
run_current: 0.650
stealthchop_threshold: 999999

# Y — MOTOR6
[tmc2209 stepper_y]
uart_pin: PE1
run_current: 0.650
stealthchop_threshold: 999999

# Z1 — MOTOR5
[tmc2209 stepper_z]
uart_pin: PE4
run_current: 0.325
stealthchop_threshold: 999999

# Z2 — MOTOR4
[tmc2209 stepper_z1]
uart_pin: PF2
run_current: 0.325
stealthchop_threshold: 999999

# E1 — MOTOR3
[tmc2209 extruder]
uart_pin: PC7
run_current: 0.650
stealthchop_threshold: 999999

# E2 — MOTOR2
[tmc2209 extruder1]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999

# =============================================
# FANS
# =============================================

# E1 part cooling fan (24V, slicer controlled)
[fan]
pin: PA8

# E1 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan]
pin: PE5
heater: extruder
heater_temp: 50.0

# E2 part cooling fan (24V)
[fan_generic extruder1_fan]
pin: PD12

# E2 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan2]
pin: PD13
heater: extruder1
heater_temp: 50.0

# Chamber circulation fan (24V)
[fan_generic chamber_fan]
pin: PD14

# Board cooling fan (24V)
[controller_fan board_fan]
pin: PD15
fan_speed: 1.0
idle_timeout: 60

# Chamber exhaust fan (24V)
[fan_generic exhaust_fan]
pin: PB11

# =============================================
# MISC
# =============================================

[z_tilt]
z_positions:
    0, 127
    375, 127
points:
    30, 127
    345, 127
speed: 50
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01
