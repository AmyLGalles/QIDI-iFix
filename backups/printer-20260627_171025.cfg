# QIDI i-Fast — Klipper config for BTT Octopus Pro V1.1 (STM32H723)
# All TMC2209 drivers in UART mode
#
# Motor assignments (physical socket → function):
#   MOTOR2 → E2 (left extruder)
#   MOTOR3 → E1 (right extruder)
#   MOTOR4 → Z2
#   MOTOR5 → Z1
#   MOTOR6 → X (swapped with Y in config)
#   MOTOR7 → Y (swapped with X in config)
#
# Fan assignments:
#   FAN0/PA8  → E1 part cooling (24V)
#   FAN1/PE5  → E1 hotend fan (12V)
#   FAN2/PD12 → E2 part cooling (24V)
#   FAN3/PD13 → E2 hotend fan (12V)
#   FAN4/PD14 → Chamber circulation (24V)
#   FAN5/PD15 → Board cooling (24V)
#   HE3/PB11  → Chamber exhaust (24V)

[include mainsail.cfg]

# =============================================
# MCU
# =============================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_22001F000951333231343036-if00

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50445059303F971C-if00
restart_method: command

# =============================================
# PRINTER
# =============================================
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
max_z_velocity: 8
max_z_accel: 100

[force_move]
enable_force_move: True

# =============================================
# X AXIS — MOTOR6 (swapped with Y in config)
# Endstop at front-left (min position)
# =============================================
[stepper_x]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG14
position_endstop: 0
position_min: -5
position_max: 385
homing_speed: 30
second_homing_speed: 5

# =============================================
# Y AXIS — MOTOR7 (swapped with X in config)
# Endstop at front-left (min position)
# =============================================
[stepper_y]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG15
position_endstop: 0
position_min: 0
position_max: 255
homing_speed: 30
second_homing_speed: 5

# =============================================
# Z AXIS — MOTOR5 (Z1) and MOTOR4 (Z2)
# Endstop at bottom (max position, bed fully down)
# Positive Z = bed moves down (away from nozzle)
# =============================================
[stepper_z]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG13
position_endstop: 324.125
position_min: -5
position_max: 330
homing_speed: 8
second_homing_speed: 4
homing_positive_dir: true

[stepper_z1]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG12

# =============================================
# HOMING OVERRIDE — supports individual axis homing
# =============================================
[homing_override]
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < 10 %}
            G1 Z10 F300
        {% endif %}
    {% endif %}
    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}
    {% if home_all or 'X' in params %}
        G28 X
    {% endif %}
    {% if home_all or 'Z' in params %}
        G28 Z
    {% endif %}
axes: xyz

# =============================================
# EXTRUDER 1 (right, E1) — MOTOR3
# PT1000 via analog input T0
# =============================================
[extruder]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 22.94
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: PA0
sensor_type: PT1000
sensor_pin: PF4
control: pid
pid_Kp: 18
pid_Ki: 1.08
pid_Kd: 98
min_temp: 0
max_temp: 300
min_extrude_temp: 180

# =============================================
# EXTRUDER 2 (left, E2) — MOTOR2
# PT1000 via analog input T1
# Nozzle offset configured in OrcaSlicer
# =============================================
[extruder1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 21.57
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: PA3
sensor_type: PT1000
sensor_pin: PF5
control: pid
pid_Kp: 18
pid_Ki: 1.08
pid_Kd: 98
min_temp: 0
max_temp: 300
min_extrude_temp: 180

# =============================================
# HEATED BED — via relay board
# Octopus HB output → relay control in
# 24V PSU → relay DC in
# Relay hot bed out → bed heater
# =============================================
[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 50
pid_Ki: 3.0
pid_Kd: 200
min_temp: 0
max_temp: 120

# =============================================
# CHAMBER HEATER — 12 ohm, 48W at 24V
# =============================================
[heater_generic chamber]
heater_pin: PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF6
control: pid
pid_Kp: 50
pid_Ki: 3.0
pid_Kd: 200
min_temp: 0
max_temp: 80

# =============================================
# TMC2209 DRIVER CONFIGURATION
# =============================================

# X — MOTOR6
[tmc2209 stepper_x]
uart_pin: PE1
run_current: 0.650
stealthchop_threshold: 999999

# Y — MOTOR7
[tmc2209 stepper_y]
uart_pin: PD3
run_current: 0.650
stealthchop_threshold: 999999

# Z1 — MOTOR5
[tmc2209 stepper_z]
uart_pin: PE4
run_current: 0.325
stealthchop_threshold: 999999

# Z2 — MOTOR4
[tmc2209 stepper_z1]
uart_pin: PF2
run_current: 0.325
stealthchop_threshold: 999999

# E1 — MOTOR3
[tmc2209 extruder]
uart_pin: PC7
run_current: 0.650
stealthchop_threshold: 999999

# E2 — MOTOR2
[tmc2209 extruder1]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999

# =============================================
# FANS
# =============================================

# E1 part cooling fan (24V, slicer controlled)
[fan]
pin: PA8

# E1 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan]
pin: PE5
heater: extruder
heater_temp: 50.0

# E2 part cooling fan (24V)
[fan_generic extruder1_fan]
pin: PD12

# E2 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan2]
pin: PD13
heater: extruder1
heater_temp: 50.0

# Chamber circulation fan (24V)
[fan_generic chamber_fan]
pin: PD14

# Board cooling fan (24V)
[controller_fan board_fan]
pin: PD15
fan_speed: 1.0
idle_timeout: 60

# Chamber exhaust fan (24V)
[fan_generic exhaust_fan]
pin: PB11

# =============================================
# BTT EDDY DUO PROBE
# =============================================
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 26.86
y_offset: -12.82
z_offset: 0.01

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

# =============================================
# BED MESH
# =============================================
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 70, 60
mesh_max: 345, 230
probe_count: 5, 5

# =============================================
# Z TILT — stepper_z is LEFT, stepper_z1 is RIGHT
# =============================================
[z_tilt]
z_positions:
    0, 127
    375, 127
points:
    60, 127
    310, 127
speed: 50
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.05

# =============================================
# TOOL CHANGE MACROS
# =============================================
[gcode_macro T0]
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 X380 F6000
        G1 X370 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 X-3 F6000
        G1 X5 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1