# QIDI i-Fast — Klipper config for BTT Octopus Pro V1.1 (STM32H723)
# All TMC2209 drivers in UART mode
#
# Motor assignments (physical socket → function):
#   MOTOR2 → E2 (left extruder)
#   MOTOR3 → E1 (right extruder)
#   MOTOR4 → Z2
#   MOTOR5 → Z1
#   MOTOR6 → X (config pins swapped with MOTOR7)
#   MOTOR7 → Y (config pins swapped with MOTOR6)
#
# Fan assignments:
#   FAN0/PA8  → E1 part cooling (24V)
#   FAN1/PE5  → E1 hotend fan (12V)
#   FAN2/PD12 → E2 part cooling (24V)
#   FAN3/PD13 → E2 hotend fan (12V)
#   FAN4/PD14 → Chamber circulation (24V)
#   FAN5/PD15 → Board cooling (24V)
#   HE3/PB11  → Chamber exhaust (24V)

[include mainsail.cfg]
[include eddy.cfg]
# [include profiles.cfg]
# [save_variables]
# filename: ~/printer_data/config/variables.cfg
# [include power_loss_recovery.cfg]
# [include power_loss_recovery_macros.cfg]

# =============================================
# MCU
# =============================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_22001F000951333231343036-if00

# [mcu eddy]
# serial: /dev/serial/by-id/usb-Klipper_rp2040_50445059303F971C-if00
# restart_method: command

# =============================================
# LEDs
# =============================================
[output_pin chamber_lights]
pin: PB7
value: 1

[gcode_macro LIGHTS]
gcode:
    {% if printer["output_pin chamber_lights"].value == 1 %}
        SET_PIN PIN=chamber_lights VALUE=0
    {% else %}
        SET_PIN PIN=chamber_lights VALUE=1
    {% endif %}

# =============================================
# PRINTER
# =============================================
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
max_z_velocity: 8
max_z_accel: 100

[force_move]
enable_force_move: True

# =============================================
# X AXIS — MOTOR6 pins (physically swapped with Y)
# Endstop at front-left (min position)
# Homing to left also activates T1 (left nozzle)
# =============================================
[stepper_x]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG14
position_endstop: 0
position_min: -5
position_max: 385
homing_speed: 30
second_homing_speed: 5

# =============================================
# Y AXIS — MOTOR7 pins (physically swapped with X)
# Endstop at front-left (min position)
# =============================================
[stepper_y]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG15
position_endstop: 0
position_min: -5
position_max: 255
homing_speed: 30
second_homing_speed: 5

# =============================================
# Z AXIS — MOTOR5 (Z1, left) and MOTOR4 (Z2, right)
# Endstop at bottom (max position, bed fully down)
# Positive Z = bed moves down (away from nozzle)
# =============================================
[stepper_z]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG13
position_endstop: 325
position_min: -2
position_max: 330
homing_speed: 8
second_homing_speed: 4
homing_positive_dir: true

[stepper_z1]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG12

# =============================================
# HOMING OVERRIDE — supports individual axis homing
# Homing X activates T1 physically (left nozzle)
# =============================================
[homing_override]
gcode:
    SET_GCODE_OFFSET Z=0 X=0 Y=0
    G90
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < 10 %}
            G1 Z10 F300
        {% endif %}
    {% endif %}
    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}
    {% if home_all or 'X' in params %}
        G28 X
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        {% set total_z = printer["gcode_macro _OFFSETS"].t1_z + printer["gcode_macro _OFFSETS"].bed_z %}
        SET_GCODE_OFFSET Z={total_z}
    {% endif %}
    {% if home_all or 'Z' in params %}
        G28 Z
    {% endif %}
axes: xyz

# =============================================
# EXTRUDER 1 (right, E1) — MOTOR3
# PT1000 via analog input T0
# E1 heater must be wired directly to HE0 (bypass breakout boards)
# =============================================
[extruder]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 22.31
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: PA0
sensor_type: PT1000
sensor_pin: PF4
min_temp: 0
max_temp: 320
min_extrude_temp: 180
smooth_time: 2.0
max_extrude_cross_section: 5

# =============================================
# EXTRUDER 2 (left, E2) — MOTOR2
# PT1000 via analog input T1
# =============================================
[extruder1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 21.57
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: PA3
sensor_type: PT1000
sensor_pin: PF5
min_temp: 0
max_temp: 320
min_extrude_temp: 180
smooth_time: 2.0
max_extrude_cross_section: 5

# =============================================
# HEATED BED — via relay board
# Octopus HB output → relay control in
# 24V PSU → relay DC in → bed heater
# =============================================
[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120

[verify_heater extruder]
max_error: 200
check_gain_time: 40

[verify_heater extruder1]
max_error: 200
check_gain_time: 40

# =============================================
# CHAMBER HEATER — 12 ohm, 48W at 24V
# =============================================
[heater_generic chamber]
heater_pin: PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF6
min_temp: 0
max_temp: 80

# =============================================
# TMC2209 DRIVER CONFIGURATION
# =============================================

# X — MOTOR6 pins
[tmc2209 stepper_x]
uart_pin: PE1
run_current: 0.650
stealthchop_threshold: 999999

# Y — MOTOR7 pins
[tmc2209 stepper_y]
uart_pin: PD3
run_current: 0.650
stealthchop_threshold: 999999

# Z1 — MOTOR5
[tmc2209 stepper_z]
uart_pin: PE4
run_current: 0.325
stealthchop_threshold: 999999

# Z2 — MOTOR4
[tmc2209 stepper_z1]
uart_pin: PF2
run_current: 0.325
stealthchop_threshold: 999999

# E1 — MOTOR3
[tmc2209 extruder]
uart_pin: PC7
run_current: 0.650
stealthchop_threshold: 999999

# E2 — MOTOR2
[tmc2209 extruder1]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999

# =============================================
# FANS
# =============================================

# E1 part cooling fan (24V, slicer controlled)
[fan]
pin: PA8

# E1 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan]
pin: PE5
heater: extruder
heater_temp: 50.0

# E2 part cooling fan (24V)
[fan_generic extruder1_fan]
pin: PD12

# E2 hotend heatsink fan (12V, auto at 50°C)
[heater_fan hotend_fan2]
pin: PD13
heater: extruder1
heater_temp: 50.0

# Chamber circulation fan (24V)
[fan_generic chamber_fan]
pin: PD14

# Board cooling fan (24V)
[controller_fan board_fan]
pin: PD15
fan_speed: 1.0
idle_timeout: 60

# Chamber exhaust fan (24V)
[fan_generic exhaust_fan]
pin: PB11

# =============================================
# START PRINT MACRO
# =============================================

[gcode_macro START_PRINT]
gcode:
    {% set bed_temp = params.BED|default(60)|float %}
    {% set t0_temp = params.T0|default(0)|float %}
    {% set t1_temp = params.T1|default(0)|float %}
    {% set initial = params.INITIAL|default(0)|int %}
    
    CLEAR_PAUSE
    M190 S{bed_temp}
    G28
    T0
    SET_GCODE_OFFSET Z=0 X=0
    PROBE_OR_LOAD
    
    {% if t0_temp > 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t0_temp}
    {% endif %}
    {% if t1_temp > 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={t1_temp}
    {% endif %}
    {% if t0_temp > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t0_temp - 5}
    {% endif %}
    {% if t1_temp > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={t1_temp - 5}
    {% endif %}
    
    {% if initial == 0 %}
        T0
    {% else %}
        T1
    {% endif %}
    {% set purge_z = 0.3 - printer["gcode_move"].homing_origin.z %}
    G92 E0
    G1 Z5 F300
    G1 X50 Y10 F3000
    G1 Z0.7 F300
    ; Lap 1
    G1 X90 E3 F500
    G1 Y12 F3000
    G1 X50 E6 F500
    ; Lap 2
    G1 Y14 F3000
    G1 X90 E9 F500
    G1 Y16 F3000
    G1 X50 E12 F500
    ; Lap 3
    G1 Y18 F3000
    G1 X90 E15 F500
    ; Wipe
    G1 X80 Z0.45 F8000
    G1 X75 Z0.7 F8000
    G92 E0

# =============================================
# BTT EDDY DUO PROBE
# =============================================
[gcode_macro MANUAL_PROBE_BED]
gcode:
    M190 S70
    G28
    SET_GCODE_OFFSET Z=0 X=0
    G1 X380 F6000
    G1 X370 F6000
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    G1 X187 Y127 F3000
    G1 Z2 F300
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE
    SAVE_CONFIG

[gcode_macro PROBE_OR_LOAD]
gcode:
        SET_GCODE_OFFSET X=0 Z=0
        G1 Z2 F300
        Z_TILT_ADJUST
        BED_MESH_CALIBRATE

