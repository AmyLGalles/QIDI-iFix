# =============================================
# BED MESH
# =============================================
# [bed_mesh]
# speed: 120
# horizontal_move_z: 2
# mesh_min: 70, 60
# mesh_max: 345, 230
# probe_count: 5, 5

# [bed_mesh]
# speed: 120
# horizontal_move_z: 2
# mesh_min: 75, 65
# mesh_max: 330, 220
# probe_count: 13, 13
# mesh_pps: 0, 0
# algorithm: bicubic

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 75, 65          # Pulled slightly inward
mesh_max: 330, 220        # Pulled 15mm back from X=345 and 10mm from Y=230
probe_count: 5, 5
mesh_pps: 0, 0            # Disables artificial point interpolation
algorithm: lagrange       # Use lagrange for a 5x5 grid (or bicubic if preferred)


# =============================================
# Z TILT — stepper_z is LEFT, stepper_z1 is RIGHT
# =============================================
[z_tilt]
z_positions:
    0, 127
    375, 127
points:
    100, 127
    310, 127
speed: 50
horizontal_move_z: 2
retries: 10
retry_tolerance: 0.05

# =============================================
# TOOL CHANGE MACROS
# T0 = right nozzle (E1), T1 = left nozzle (E2)
# =============================================
[gcode_macro _CHECK_Z_SAFE]
gcode:
    {% if printer.toolhead.position.z < 1 %}
        G1 Z5 F300
    {% endif %}
[gcode_macro _OFFSETS]
variable_t0_z: 0.362
variable_t1_z: -0.054
variable_t0_x: 22.71
variable_t1_x: 50.25
variable_t0_y: -0.5
variable_bed_z: 0.0
gcode:

[gcode_macro T0]
gcode:
	_CHECK_Z_SAFE
    G90
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 X380 F6000
        G1 X350 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET Z={printer["gcode_macro _OFFSETS"].t0_z} X={printer["gcode_macro _OFFSETS"].t0_x} Y={printer["gcode_macro _OFFSETS"].t0_y} MOVE=1
    
[gcode_macro T1]
gcode:
	_CHECK_Z_SAFE
    G90
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 X-3 F6000
        G1 X35 F6000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_GCODE_OFFSET Z={printer["gcode_macro _OFFSETS"].t1_z} X={printer["gcode_macro _OFFSETS"].t1_x} Y=0 MOVE=1
    
# =============================================
# CENTER CARRIAGE MACRO
# =============================================
[gcode_macro CENTER]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X190 Y127 F6000

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 187
variable_custom_park_y: 127
variable_custom_park_dz: 10
variable_speed_hop: 15
variable_speed_move: 100
variable_retract: 2
variable_unretract: 2
gcode:


# =============================================
# PAUSE AND RESUME MACROS
# =============================================

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE2
description: Pause with extruder state saving
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    {% set z_offset = printer.gcode_move.homing_origin.z %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_extruder VALUE="'{active_extruder}'"
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z_offset VALUE={z_offset}
    PAUSE_BASE2

[gcode_macro RESUME]
rename_existing: RESUME_BASE2
description: Resume with extruder state restore
variable_saved_extruder: 'extruder'
variable_saved_z_offset: 0
gcode:
    {% set extruder = saved_extruder %}
    {% set z_offset = saved_z_offset %}
    ACTIVATE_EXTRUDER EXTRUDER={extruder}
    SET_GCODE_OFFSET Z={z_offset}
    RESUME_BASE2

# =============================================
# CANCEL PRINT MACRO
# =============================================
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M106 S0
    SET_GCODE_OFFSET Z=0
    G90
    {% if printer.extruder.temperature > 170 %}
        G92 E0
        G1 E-5 F1800
    {% endif %}
    G91
    G1 Z10 F300
    G90
    G1 X187 Y127 F6000
    M84
    BASE_CANCEL_PRINT

