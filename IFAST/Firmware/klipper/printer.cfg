# QIDI i-Fast — Klipper config for BTT Octopus Pro V1.1 (STM32H723)
# All TMC2209 drivers in UART mode
#
# Motor assignments:
#   MOTOR0 → E1 (right extruder)
#   MOTOR1 → E2 (left extruder)
#   MOTOR2 → X
#   MOTOR3 → Y
#   MOTOR4 → Z1
#   MOTOR5 → Z2
#
# IMPORTANT: Test each axis carefully before running prints.
# Use STEPPER_BUZZ and QUERY_ENDSTOPS to verify wiring before homing.

# =============================================
# MCU
# =============================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_22001F000951333231343036-if00

# =============================================
# PRINTER
# =============================================
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
max_z_velocity: 8
max_z_accel: 100

# =============================================
# X AXIS — MOTOR2
# Homes to max (rear-right), normally open endstop
# =============================================
[stepper_x]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 34.0
endstop_pin: PG10           # STOP_2 header — wire X endstop here
position_endstop: 264.5
position_min: 0
position_max: 264.5
homing_speed: 30
second_homing_speed: 5
homing_positive_dir: true

# =============================================
# Y AXIS — MOTOR3
# Homes to max, normally open endstop
# =============================================
[stepper_y]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 34.0
endstop_pin: PG11           # STOP_3 header — wire Y endstop here
position_endstop: 154
position_min: 0
position_max: 154
homing_speed: 30
second_homing_speed: 5
homing_positive_dir: true

# =============================================
# Z AXIS — MOTOR4 (Z1) and MOTOR5 (Z2)
# Homes to max (Z+, nozzle farthest from bed)
# =============================================
[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8.0
endstop_pin: PG6             # STOP_0 header — wire Z endstop here
position_endstop: 154
position_min: 0
position_max: 154
homing_speed: 8
second_homing_speed: 4
homing_positive_dir: true

[stepper_z1]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 8.0
endstop_pin: PG6             # shares Z endstop — change if dual Z endstops

# =============================================
# EXTRUDER 1 (right, E1) — MOTOR0
# =============================================
