# =============================================
# EXTRUDER 2 (left, E2) — MOTOR1
# NOTE: Nozzle offset is -34mm in X, 0 in Y relative to E1
# Configure offset in slicer or via Klipper gcode_offset
# =============================================
# [extruder1]
# step_pin: PG0
# dir_pin: PG1
# enable_pin: !PF15
# microsteps: 16
# rotation_distance: 34.24
# nozzle_diameter: 0.400
# filament_diameter: 1.750
# heater_pin: PA3              # HE1
# sensor_pin: PF5              # T1
# sensor_type: EPCOS 100K B57560G104F    # TODO: verify actual sensor type
# control: pid
# pid_Kp: 18
# pid_Ki: 1.08
# pid_Kd: 98
# min_temp: 0
# max_temp: 250
# min_extrude_temp: 180

# # =============================================
# # HEATED BED
# # =============================================
# [heater_bed]
# heater_pin: PA1
# sensor_pin: PF3              # TB
# sensor_type: EPCOS 100K B57560G104F    # TODO: verify actual sensor type
# control: pid
# pid_Kp: 50
# pid_Ki: 3.0
# pid_Kd: 200
# min_temp: 0
# max_temp: 120

# =============================================
# TMC2209 DRIVER CONFIGURATION
# =============================================

# X — MOTOR2
[tmc2209 stepper_x]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999

# Y — MOTOR3
[tmc2209 stepper_y]
uart_pin: PC7
run_current: 0.650
stealthchop_threshold: 999999

# Z1 — MOTOR4
[tmc2209 stepper_z]
uart_pin: PF2
uart_address: 0
run_current: 0.325
stealthchop_threshold: 999999

# Z2 — MOTOR5
[tmc2209 stepper_z1]
uart_pin: PE4
uart_address: 0
run_current: 0.325
stealthchop_threshold: 999999

# E1 — MOTOR0
[tmc2209 extruder]
uart_pin: PC4
run_current: 0.650
stealthchop_threshold: 999999

# E2 — MOTOR1
[tmc2209 extruder1]
uart_pin: PD11
run_current: 0.650
stealthchop_threshold: 999999

# =============================================
# FANS
# Assign these to the correct Octopus fan headers
# once you know which physical connector each fan uses
# =============================================

# Part cooling fan (slicer controlled)
# [fan]
# pin: PA8

# Hotend 1 heatsink fan — turns on when hotend is warm
#[heater_fan hotend_fan]
#pin: PE5
#heater: extruder
#heater_temp: 50.0

# Hotend 2 heatsink fan
#[heater_fan hotend_fan2]
#pin: PD12
#heater: extruder1
#heater_temp: 50.0

# Board cooling fan (optional)
#[controller_fan board_fan]
#pin: PD15

# =============================================
# MISC
# =============================================

# Required for multi-stepper Z
# [z_tilt]
# z_positions:
#     0, 77        # approximate X position of Z1 leadscrew
#     264.5, 77    # approximate X position of Z2 leadscrew
# points:
#     30, 77       # probe point near Z1
#     234, 77      # probe point near Z2
# speed: 50
# horizontal_move_z: 10
# retries: 5
# retry_tolerance: 0.01

# [safe_z_home]
# home_xy_position: 132, 77   # center of bed
# speed: 50
# z_hop: 10
# z_hop_speed: 5

# Uncomment if you add a bed probe (BLTouch, inductive, etc.)
#[probe]
#pin: PB7
#x_offset: 0
#y_offset: 0
#z_offset: 0

[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5